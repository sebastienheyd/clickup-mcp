name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create/update the GitHub release
  id-token: write # npm Trusted Publishing (OIDC), no token stored

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later, which ships with Node 24
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version (expected v$version). Nothing was released or published."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and package MCPB
        run: npm run mcpb

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.mcpb"
          generateReleaseNotes: true
          draft: false
          prerelease: false
          # The release is sometimes created by hand before this workflow finishes.
          # Without allowUpdates the action then fails with "already_exists" and the
          # .mcpb asset is never attached; the omit flags keep manually written
          # release notes and titles intact when updating.
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      # Published last so that an npm problem never blocks the GitHub release, and
      # replayable: a version already on npm is skipped, so re-running the failed
      # workflow run after a partial failure is safe.
      - name: Publish to npm
        run: |
          npm_version=$(npm --version)
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$npm_version"; then
            echo "::error::npm $npm_version is too old for Trusted Publishing (11.5.1 or later required)"
            exit 1
          fi

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if out=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm, nothing to publish."
          elif echo "$out" | grep -q "E404"; then
            npm publish --access public
          else
            echo "::error::Could not check whether $name@$version is on npm:"
            echo "$out"
            exit 1
          fi
